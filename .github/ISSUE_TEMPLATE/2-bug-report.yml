name: In-game bug report
description: Something looks, sounds, or behaves wrong (graphics, audio, controls) - but the game doesn't crash.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Logs:** `sdmc:/switch/nsmbw/log.txt` and `sdmc:/switch/nsmbw/stderr.txt` on the SD card (written on every start).

        For visual bugs, a screenshot or short clip helps enormously.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I built the current `main` of this repository.
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: The problem does NOT also happen on Dolphin or a real Wii (if it does, it's how the game itself behaves).
          required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD` in your clone."
      placeholder: "e.g. aff6578"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Switch model
      options:
        - Switch 1 (original, Erista)
        - Switch 1 (V2, Mariko)
        - Switch Lite
        - Switch OLED
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Docked or handheld
      options:
        - Docked
        - Handheld
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What kind of bug is it?
      options:
        - Graphics / visual glitch
        - Audio
        - Controls (Joy-Con, Pro Controller, motion)
        - Gameplay behaves differently than on Wii/Dolphin
        - Saves / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Describe the bug and what you expected instead.
      placeholder: "e.g. The lava in World 1's castle flickers black…"
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing? / How to reproduce
      description: Which world and level, how many players and which controllers, exact steps if you can reproduce it.
      placeholder: |
        1. Enter World 1-Castle
        2. …
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot / video
      description: Drag & drop images or clips here (very helpful for visual bugs).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `log.txt` and `stderr.txt`, or paste the relevant part below.
      render: text

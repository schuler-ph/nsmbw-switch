name: Crash / freeze report
description: The game crashed, froze, or closed on its own on the Switch.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Crashes are almost impossible to fix without logs, so please fill this in fully.

        **Where to find the logs** (on the SD card, e.g. over MTP with DBI or in a card reader):
        - `sdmc:/switch/nsmbw/log.txt` and `sdmc:/switch/nsmbw/stderr.txt` (written on every start, so copy them right after the crash, before starting the game again)
        - if Atmosphère showed a crash screen: the newest file in `sdmc:/atmosphere/crash_reports/`
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I built the current `main` of this repository.
          required: true
        - label: I searched the existing issues and nobody has reported this crash yet.
          required: true
        - label: My game is New Super Mario Bros. Wii, USA (SMNE01), revision 1.
          required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD` in your clone."
      placeholder: "e.g. aff6578"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Switch model
      options:
        - Switch 1 (original, Erista)
        - Switch 1 (V2, Mariko)
        - Switch Lite
        - Switch OLED
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Docked or handheld
      options:
        - Docked
        - Handheld
    validations:
      required: true
  - type: dropdown
    id: clock
    attributes:
      label: CPU clock
      options:
        - Stock (no sys-clk profile)
        - 1785 MHz via sys-clk
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware and Atmosphère version
      placeholder: "e.g. 21.2.0 / Atmosphère 1.10.2"
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - During startup or shader compilation, before the title screen
        - On the title screen or the file select
        - On the world map
        - While loading a level
        - During a level
        - Randomly / no clear pattern
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Happened only once so far
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing when it crashed?
      description: Which world and level, how many players and which controllers, which power-up, anything you pressed right before.
      placeholder: "e.g. World 3-4 with two players on sideways Joy-Cons, it froze when Luigi picked up a propeller mushroom…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag & drop `log.txt`, `stderr.txt` and any Atmosphère crash report here, or paste the end of them below.
      render: text
    validations:
      required: true

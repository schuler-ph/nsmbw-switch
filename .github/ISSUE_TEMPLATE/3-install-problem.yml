name: Build or setup problem
description: Building the .nro, setting up the SD card, or starting the game for the first time doesn't work.
title: "[Setup] "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the README first: [Getting the game files](https://github.com/schuler-ph/nsmbw-switch#getting-the-game-files), [Build](https://github.com/schuler-ph/nsmbw-switch#build) and [Install](https://github.com/schuler-ph/nsmbw-switch#install). Most problems are a different region or revision of the game, a disc image instead of the extracted folder, or starting hbmenu from the album instead of through a title override.

        If the game starts but stops early, attach `sdmc:/switch/nsmbw/log.txt` and `stderr.txt`.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I am on the current `main` of this repository.
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: My game is New Super Mario Bros. Wii, USA (SMNE01), revision 1, extracted with Dolphin's Extract Entire Disc.
          required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      options:
        - Translating the game (unpack_game.py, prelink_rels.py, build-linux.sh)
        - Building Dawn and libuam (build-switch-deps.sh)
        - Building the .nro (build-switch.sh)
        - Copying to the SD card
        - Starting from hbmenu
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD` in your clone."
      placeholder: "e.g. aff6578"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Build machine
      description: Linux distribution or WSL2, devkitPro version (or Docker image tag).
      placeholder: "e.g. WSL2 Ubuntu 24.04, devkitpro/devkita64:20260219"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: The exact error message (copy the last lines of the build output or screenshot the Switch) and what you were doing when it appeared.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `log.txt` and `stderr.txt` from `sdmc:/switch/nsmbw/` if the game got that far.
      render: text

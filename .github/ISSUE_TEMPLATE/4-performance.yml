name: Performance problem
description: Low FPS, stutters, or the game runs slower than it should.
title: "[Perf] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Full speed needs the console **docked with the CPU at 1785 MHz** (sys-clk profile on the game you start hbmenu through, or global); see the README's Performance section. At the stock clock it ran at about 70 % speed in the last measurement; that is known.

        Attach `sdmc:/switch/nsmbw/log.txt` and `stderr.txt` from the run.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I built the current `main` of this repository.
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: I checked the clock with sys-clk's overlay or log while playing.
          required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD` in your clone."
      placeholder: "e.g. aff6578"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Switch model
      options:
        - Switch 1 (original, Erista)
        - Switch 1 (V2, Mariko)
        - Switch Lite
        - Switch OLED
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Docked or handheld
      options:
        - Docked
        - Handheld
    validations:
      required: true
  - type: input
    id: clock
    attributes:
      label: CPU / GPU / memory clock
      placeholder: "e.g. 1785 / 768 / 1600 MHz"
    validations:
      required: true
  - type: dropdown
    id: pattern
    attributes:
      label: What does the problem look like?
      options:
        - Constant low FPS everywhere
        - Stutters / hitches (mostly smooth, brief freezes)
        - Only certain levels or situations are slow
        - Only on the first visit of a level
        - Got worse after an update
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: When does it happen?
      description: Which levels, how many players, and roughly what FPS you see.
      placeholder: "e.g. Drops to ~40 FPS in World 5-Tower with four players, fine on the world map…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `log.txt` and `stderr.txt`.
      render: text
